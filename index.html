<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b12" />
    <title>Rapid</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Rapid game view"></canvas>
      <section id="hud" aria-live="polite">
        <div id="health">HEALTH 100</div>
        <div id="room-status">ROOM WAITING</div>
        <div id="ammo">ENERGY ∞</div>
      </section>
      <div id="crosshair" aria-hidden="true"></div>
      <section id="touch-controls" aria-label="Touch controls">
        <div id="move-zone"><div id="move-stick"></div></div>
        <button id="pause-button" type="button" aria-label="Pause">Ⅱ</button>
        <button id="interact-button" type="button">USE</button>
        <button id="fire-button" type="button">FIRE</button>
      </section>
      <section id="orientation-notice">
        <strong>Rotate your device</strong>
        <span>Rapid is designed for landscape play.</span>
      </section>
      <section id="pause-panel" hidden>
        <h1>Paused</h1>
        <p>Press Escape or tap pause to continue.</p>
        <div id="input-settings">
          <label for="mouse-sensitivity">
            Mouse sensitivity
            <output id="mouse-sensitivity-value" for="mouse-sensitivity">1.00</output>
          </label>
          <input id="mouse-sensitivity" type="range" min="0.25" max="3" step="0.05" />
          <label for="touch-sensitivity">
            Touch sensitivity
            <output id="touch-sensitivity-value" for="touch-sensitivity">1.00</output>
          </label>
          <input id="touch-sensitivity" type="range" min="0.25" max="3" step="0.05" />
          <label class="checkbox-setting" for="left-handed-controls">
            <input id="left-handed-controls" type="checkbox" />
            Left-handed touch layout
          </label>
        </div>
        <button id="resume-button" type="button">Resume</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
